<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>CleanSlate Pro</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js?v=pro2"></script>
</head>
<body>
<main class="app">
  <section class="hero">
    <div class="logo">CS</div>
    <div>
      <p class="eyebrow">CleanSlate Pro</p>
      <h1>Firebase Saved Cleanup - Redirect Login</h1>
      <p class="sub">Permanent sender history, protected senders, cleanup queue, and resumable Gmail scanning. No functions folder required.</p>
    </div>
  </section>

  <section class="panel">
    <h2>1. Sign In</h2>
    <button id="firebaseLoginBtn" class="primary">Sign In With Firebase Google</button>
    <button id="gmailLoginBtn" class="primary alt">Connect Gmail Access</button>
    <button id="logoutBtn" class="ghost">Logout</button>
    <div id="authStatus" class="status">App loaded. Tap Firebase Google sign-in.</div>
  </section>

  <script type="module" src="app.js?v=pro2"></script>
</main>
</body>
</html>
